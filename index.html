<section id="favourites"><div class="w"><h2>Customer Favourites</h2><p class="sub">Tap any item to customise it and add it to your order.</p><div class="grid">${fe.map(card).join("")}</div></div></section>
<section id="menu" style="background:#fff5e6"><div class="w"><h2>Our Menu</h2><p class="sub">Pick a dish, choose your add-ons, and order in a few taps.</p>
${C.cats.map(k=>{const its=menu.filter(x=>x.cat==k.id);if(k.signature&&hc)return`<div class="magic" id="cat-${k.id}"><div class="t"><span class="k">OUR SIGNATURE</span><h3>THE MAGIC CUP</h3><p>${esc(hc.desc)}</p><p class="pr" style="color:#fff;font-size:22px">${m(hc.price)}</p><button class="btn g" data-a="open" data-id="${hc.id}">Customise & Add</button></div><img src="${im(hc,1)}" alt="Hot chocolate"></div>`;return`<div class="cat" id="cat-${k.id}"><h3>${k.icon} ${esc(k.name)}</h3><div class="grid">${its.map((x,n)=>x.soon?`<div class="soon">✨ ${esc(x.name)}</div>`:card(x,n)).join("")}</div></div>`}).join("")}</div></section>
<section id="about"><div class="w"><h2>Why Momo Magic?</h2><p class="sub"></p><div class="why">${[["🥟","Fresh & Delicious","Momos made for every craving."],["☕","Café Crafted Drinks","Coffee, tea and hot chocolate."],["❤️","Made With Care","Served with attention."],["✨","Premium Ambience","A cozy place to hang out."]].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b>${x[2]}</div>`).join("")}</div></div></section>
<section id="gallery" style="background:#fff5e6"><div class="w"><h2>Step Into The Magic</h2><p class="sub">Placeholder images — replace in CONFIG.images.gallery.</p><div class="gals">${["🛋️","🥟","☕","🕯️","🍫","🧀"].map((e,n)=>`<div class="gal"><img src="${G[n]||ph(e,n)}" alt="Gallery ${n+1}" loading="lazy"></div>`).join("")}</div></div></section>
<section><div class="w"><h2>Follow the Magic</h2><p class="sub">${esc(c.instagram)}</p><div class="ig">${["🥟","☕","🍫","🧀"].map((e,n)=>`<div><img src="${S[n]||ph(e,n+2)}" alt="Social ${n+1}" loading="lazy"></div>`).join("")}</div></div></section>
<section id="contact"><div class="w"><h2>Find ${esc(c.name)}</h2><div class="loc" style="margin-top:16px"><div><p>📍 ${esc(c.address)}</p><p>📞 ${esc(c.phone)}</p><p>🕐 ${esc(c.hours)}</p></div><div class="map">${c.mapsEmbed?`<iframe src="${esc(c.mapsEmbed)}" style="border:0;width:100%;height:100%;min-height:200px" loading="lazy"></iframe>`:"Google Maps placeholder<br>(set CONFIG.cafe.mapsEmbed)"}</div></div></div></section>
<footer><div class="w"><div class="row"><span>© ${esc(c.name)}</span><a href="#" data-a="admin">Staff login</a></div></div></footer>`}
const closeO=()=>{$("#ov").innerHTML="";ui.p=null};
const shell=(h,w="")=>{$("#ov").innerHTML=`<div class="ov" data-a="bg"><div class="md ${w}">${h}</div></div>`};
function prodModal(){const p=ui.p,i=it(p.id),g=addons[i.ag]||[],s=(i.sizes||[])[p.size];const line=lp(p),each=(line.base+line.add)/p.qty||0;
shell(`<button class="x" data-a="close">×</button><div class="im" style="border-radius:16px;margin-bottom:12px"><img src="${im(i)}" alt=""></div><h3>${vg(i)} ${esc(i.name)}</h3><p style="color:var(--muted)">${esc(i.desc)}</p>
${i.sizes?`<b>Size</b><div class="seg">${i.sizes.map((z,n)=>`<label class="${p.size==n?"on":""}"><input type="radio" name="sz" data-a="size" data-n="${n}">${z.n}${z.d?` +${m(z.d)}`:""}</label>`).join("")}</div>`:""}
<b>Quantity</b><div class="qty" style="margin:8px 0"><button data-a="pq" data-d="-1">−</button><b>${p.qty}</b><button data-a="pq" data-d="1">+</button></div>
${g.length?`<b>Add-ons</b>${g.map(a=>`<label class="opt"><span><input type="checkbox" data-a="pad" data-k="${a.id}" ${p.ad.includes(a.id)?"checked":""}> ${esc(a.name)}</span><span>${a.price?"+"+m(a.price):"Free"}</span></label>`).join("")}`:""}
<button class="btn g" style="width:100%;margin-top:14px;padding:14px" data-a="add">Add to Cart — ${m(line.base+line.add)}</button>`)}
function cartModal(){const t=calc();shell(`<button class="x" data-a="close">×</button><h3>Your Order</h3>${cart.length?cart.map((l,n)=>{const i=it(l.id),p=lp(l);return`<div class="ln"><div><b>${esc(i.name)}</b>${i.sizes?`<small>${i.sizes[l.size].n}</small>`:""}${l.ad.map(k=>`<small>+ ${esc(addons[i.ag].find(a=>a.id==k)?.name)} × ${l.qty}</small>`).join("")}<div class="qty" style="margin-top:6px"><button data-a="cq" data-n="${n}" data-d="-1">−</button>${l.qty}<button data-a="cq" data-n="${n}" data-d="1">+</button><button class="btn o sm" data-a="rm" data-n="${n}">Remove</button></div></div><b>${m(p.base+p.add)}</b></div>`}).join("")+sum(t)+`<div class="cta"><button class="btn o" data-a="close">Add more items</button><button class="btn" data-a="checkout">Checkout</button></div>`:`<p>Your cart is empty. Pick something tasty from the menu.</p><button class="btn" data-a="close">Browse menu</button>`}`)}
const sum=t=>`<div style="margin-top:12px"><div class="tot"><span>Subtotal</span><span>${m(t.s)}</span></div><div class="tot"><span>Add-ons</span><span>${m(t.a)}</span></div>${t.d?`<div class="tot"><span>Discount (${bill.discount.rate}%)</span><span>−${m(t.d)}</span></div>`:""}${t.sc?`<div class="tot"><span>Service charge (${bill.service.rate}%)</span><span>${m(t.sc)}</span></div>`:""}${t.t?`<div class="tot"><span>Tax (${bill.tax.rate}%)</span><span>${m(t.t)}</span></div>`:""}<div class="tot b"><span>Grand Total</span><span>${m(t.g)}</span></div></div>`;
function coModal(err=""){const o=ui.co,t=calc();shell(`<button class="x" data-a="cart">←</button><h3>Checkout</h3><b>Order type</b><div class="seg">${[["dine","Dine In"],["takeaway","Takeaway"],["pickup","Pickup"]].map(x=>`<label class="${o.type==x[0]?"on":""}"><input type="radio" data-a="otype" data-v="${x[0]}">${x[1]}</label>`).join("")}</div>
${o.type=="dine"?`<b>Table</b><select class="f" data-f="table">${Array.from({length:C.tables},(_,n)=>`<option value="${n+1}" ${o.table==n+1?"selected":""}>Table ${String(n+1).padStart(2,"0")}</option>`).join("")}</select>`:`<input class="f" data-f="name" placeholder="Your name" value="${esc(o.name)}"><input class="f" data-f="phone" placeholder="Phone number" inputmode="tel" value="${esc(o.phone)}">`}
<b>Payment</b><div class="seg">${C.payments.map(p=>`<label class="${o.payMethod==p.id?"on":""}"><input type="radio" data-a="pay" data-v="${p.id}">${p.name}</label>`).join("")}</div>
<p style="font-size:13px;color:var(--muted)">Online payment is in test mode: no money is taken. Cash and Pay at Café are settled at the counter.</p>${sum(t)}<p class="err">${err}</p><button class="btn g" style="width:100%;padding:14px" data-a="place">Place Order — ${m(t.g)}</button>`)}
const receipt=o=>`<div class="receipt"><h3>${esc(C.cafe.name.toUpperCase())}</h3><hr><div class="r"><span>Order #${o.id}</span><span>${o.date}</span></div><div class="r"><span>${o.type=="dine"?"Table "+o.table:o.type+" · "+esc(o.name)}</span><span>${o.time}</span></div><hr>${o.lines.map(l=>`<div class="r"><span>${esc(l.name)} × ${l.qty}</span><span>${m(l.base)}</span></div>${l.ad.map(a=>`<div class="r"><span>&nbsp;+ ${esc(a)} × ${l.qty}</span><span>${m(l.addT[a]||0)}</span></div>`).join("")}`).join("")}<hr><div class="r"><span>Subtotal</span><span>${m(o.t.s)}</span></div><div class="r"><span>Add-ons</span><span>${m(o.t.a)}</span></div><div class="r"><span>Discount</span><span>${m(o.t.d)}</span></div>${o.t.sc?`<div class="r"><span>Service</span><span>${m(o.t.sc)}</span></div>`:""}<div class="r"><span>Tax</span><span>${m(o.t.t)}</span></div><div class="r"><b>TOTAL</b><b>${m(o.t.g)}</b></div><hr><div>Payment: ${o.pay}</div><p style="text-align:center">Thank you for visiting<br>${esc(C.cafe.name)} ❤️</p></div>`;
function showReceipt(o){shell(`<button class="x" data-a="close">×</button><h3>Order placed ✓</h3>${receipt(o)}<div class="cta noprint"><button class="btn" data-a="print" data-id="${o.id}">Print receipt</button><button class="btn o" data-a="close">Done</button></div>`)}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
function place(){const o=ui.co;if(o.type!="dine"){if(!o.name.trim())return coModal("Enter your name.");if(!/^\d{10}$/.test(o.phone.replace(/\D/g,"").slice(-10))||o.phone.replace(/\D/g,"").length<10)return coModal("Enter a valid 10-digit phone number.")}
const t=calc(),d=new Date(),ord={id:"MM"+(1024+orders.length),date:d.toLocaleDateString("en-IN"),time:d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),type:o.type,table:o.table,name:o.name,phone:o.phone,payMethod:o.payMethod,t,status:"New",
 lines:cart.map(l=>{const i=it(l.id),p=lp(l),addT={};l.ad.forEach(k=>{const a=addons[i.ag].find(x=>x.id==k);addT[a.name]=a.price*l.qty});return{name:i.name+(i.sizes?" ("+i.sizes[l.size].n+")":""),qty:l.qty,base:p.base,ad:Object.keys(addT),addT}})};
PaymentProvider.pay(ord).then(r=>{ord.pay=r.status;orders.unshift(ord);sv("mm_orders",orders);cart=[];render();showReceipt(ord)})}
const STAT=["New","Accepted","Preparing","Ready","Completed","Cancelled"];
function admin(){const a=$("#adm");if(!ui.admin){a.innerHTML="";return}
const tabs=["orders","menu","add-ons","settings"];let b="";
if(admTab=="orders")b=orders.length?`<div class="scr"><table class="tb"><tr><th>ID<th>Customer<th>Type<th>Items<th>Total<th>Payment<th>Status</tr>${orders.map((o,n)=>`<tr><td>${o.id}<td>${o.type=="dine"?"Table "+o.table:esc(o.name)+"<br>"+esc(o.phone)}<td>${o.type}<td>${o.lines.map(l=>esc(l.name)+" ×"+l.qty).join("<br>")}<td>${m(o.t.g)}<td>${o.pay}<td><select data-f="st" data-n="${n}">${STAT.map(s=>`<option ${o.status==s?"selected":""}>${s}</option>`).join("")}</select></tr>`).join("")}</table></div>`:"<p>No orders yet. Place a test order from the site.</p>";
if(admTab=="menu")b=`<div class="scr"><table class="tb"><tr><th>Name<th>Category<th>Price<th>Image URL<th>Description<th>Avail<th>Popular<th>Soon<th></tr>${menu.map((i,n)=>`<tr><td><input data-f="mi" data-n="${n}" data-k="name" value="${esc(i.name)}"><td><select data-f="mi" data-n="${n}" data-k="cat">${C.cats.map(k=>`<option value="${k.id}" ${i.cat==k.id?"selected":""}>${k.name}</option>`).join("")}</select><td><input type="number" data-f="mi" data-n="${n}" data-k="price" value="${i.price}"><td><input data-f="mi" data-n="${n}" data-k="img" value="${esc(i.img)}"><td><input data-f="mi" data-n="${n}" data-k="desc" value="${esc(i.desc)}">${["avail","popular","soon"].map(k=>`<td><input type="checkbox" data-f="mc" data-n="${n}" data-k="${k}" ${i[k]?"checked":""}>`).join("")}<td><button class="btn o sm" data-a="mdel" data-n="${n}">Delete</button></tr>`).join("")}</table></div><button class="btn" style="margin-top:12px" data-a="madd">+ Add item</button>`;
if(admTab=="add-ons")b=Object.keys(addons).map(g=>`<h4 style="margin:16px 0 6px">${g}</h4><table class="tb">${addons[g].map((a,n)=>`<tr><td><input data-f="ai" data-g="${g}" data-n="${n}" data-k="name" value="${esc(a.name)}"><td><input type="number" data-f="ai" data-g="${g}" data-n="${n}" data-k="price" value="${a.price}"><td><button class="btn o sm" data-a="adel" data-g="${g}" data-n="${n}">Delete</button></tr>`).join("")}</table><button class="btn o sm" style="margin-top:6px" data-a="aadd" data-g="${g}">+ Add add-on</button>`).join("");
if(admTab=="settings")b=["tax","service","discount"].map(k=>`<div class="opt"><span><input type="checkbox" data-f="bo" data-k="${k}" ${bill[k].on?"checked":""}> ${k[0].toUpperCase()+k.slice(1)} ON</span><span><input type="number" style="width:80px;padding:6px" data-f="br" data-k="${k}" value="${bill[k].rate}"> %</span></div>`).join("")+`<p style="color:var(--muted);font-size:14px">Changes save in this browser only. To make them permanent for everyone, copy the values into CONFIG.</p><button class="btn o" data-a="reset">Reset menu, add-ons & billing to CONFIG</button>`;
a.innerHTML=`<div class="w"><div class="row"><h2>Admin</h2><button class="btn o sm" data-a="admx">Close</button></div><div class="tabs">${tabs.map(t=>`<button class="${admTab==t?"on":""}" data-a="tab" data-v="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>${b}</div>`}
const saveAll=()=>{sv("mm_menu",menu);sv("mm_addons",addons);sv("mm_bill",bill);sv("mm_orders",orders)};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,d=el.dataset,p=ui.p;
if(a=="bg"){if(e.target==el)closeO();return}
if(a=="admin"){e.preventDefault();ui.admin=1;admin()}else if(a=="admx"){ui.admin=0;admin();render()}
else if(a=="burger")$("#links").classList.toggle("open");
else if(a=="open"){ui.p={id:d.id,qty:1,size:0,ad:[]};prodModal()}
else if(a=="close")closeO();
else if(a=="pq"){p.qty=Math.max(1,p.qty+ +d.d);prodModal()}
else if(a=="size"){p.size=+d.n;prodModal()}
else if(a=="pad"){const k=d.k;p.ad=p.ad.includes(k)?p.ad.filter(x=>x!=k):[...p.ad,k];prodModal()}
else if(a=="add"){const ex=cart.find(l=>l.id==p.id&&l.size==p.size&&[...l.ad].sort()+""==[...p.ad].sort()+"");ex?ex.qty+=p.qty:cart.push({id:p.id,qty:p.qty,size:p.size,ad:[...p.ad]});closeO();render();const c=$(".cartb");c.classList.add("pop");toast("Added to cart")}
else if(a=="cart")cartModal();
else if(a=="cq"){const l=cart[+d.n];l.qty=Math.max(1,l.qty+ +d.d);cartModal();render()}
else if(a=="rm"){cart.splice(+d.n,1);cartModal();render()}
else if(a=="checkout")coModal();
else if(a=="otype"){ui.co.type=d.v;coModal()}else if(a=="pay"){ui.co.payMethod=d.v;coModal()}
else if(a=="place")place();
else if(a=="print"){const o=orders.find(x=>x.id==d.id);$("#print").innerHTML=receipt(o);window.print()}
else if(a=="tab"){admTab=d.v;admin()}
else if(a=="madd"){menu.push({id:"item-"+Date.now(),name:"New item",cat:C.cats[0].id,ag:C.cats[0].id=="momos"?"momo":C.cats[0].id,price:0,avail:true,img:"",em:"🥟",desc:""});saveAll();admin()}
else if(a=="mdel"){menu.splice(+d.n,1);saveAll();admin()}
else if(a=="aadd"){addons[d.g].push({id:"a"+Date.now(),name:"New add-on",price:0});saveAll();admin()}
else if(a=="adel"){addons[d.g].splice(+d.n,1);saveAll();admin()}
else if(a=="reset"){["mm_menu","mm_addons","mm_bill"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});menu=C.menu;addons=C.addons;bill=C.billing;admin()}});
document.addEventListener("change",e=>{const el=e.target,f=el.dataset.f,d=el.dataset;if(!f)return;
if(f=="table")ui.co.table=+el.value;else if(f=="st"){orders[+d.n].status=el.value}
else if(f=="mi")menu[+d.n][d.k]=d.k=="price"?+el.value||0:el.value;else if(f=="mc")menu[+d.n][d.k]=el.checked;
else if(f=="ai")addons[d.g][+d.n][d.k]=d.k=="price"?+el.value||0:el.value;
else if(f=="bo")bill[d.k].on=el.checked;else if(f=="br")bill[d.k].rate=+el.value||0;
saveAll();if(ui.admin&&(f=="mi"||f=="mc")){}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset.f=="name")ui.co.name=el.value;if(el.dataset.f=="phone")ui.co.phone=el.value});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeO()});
render();
</script></body></html>
